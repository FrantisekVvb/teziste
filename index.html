<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Těžiště</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app" id="app" data-tool="move">
      <header class="hud" aria-label="Ovládání">
        <div class="hud-left">
          <h1 class="hud-title">Těžiště</h1>
          <div class="shape-picker" role="group" aria-label="Výběr objektu">
            <button type="button" class="shape-btn is-active" data-shape="utvar" aria-pressed="true">
              <span class="shape-swatch" style="background: #f06d6d"></span>
              Útvar
            </button>
            <button type="button" class="shape-btn" data-shape="kruh" aria-pressed="false">
              <span class="shape-swatch" style="background: #5b8def"></span>
              Kruh
            </button>
            <button type="button" class="shape-btn" data-shape="podkova" aria-pressed="false">
              <span class="shape-swatch" style="background: #e8a317"></span>
              Podkova
            </button>
            <button type="button" class="shape-btn" data-shape="bumerang" aria-pressed="false">
              <span class="shape-swatch" style="background: #6fbf73"></span>
              Bumerang
            </button>
          </div>
        </div>
        <div class="hud-actions">
          <button type="button" id="tool-guess-cm" class="hud-btn" aria-pressed="false">
            Označit těžiště
          </button>
          <button type="button" id="tool-pencil" class="hud-btn" aria-pressed="false">
            Tužka
          </button>
          <button type="button" id="clear-drawings-btn" class="hud-btn">
            Smazat
          </button>
          <button type="button" id="unhook-btn" class="hud-btn">
            Sundat
          </button>
        </div>
      </header>

      <p id="guess-feedback" class="guess-feedback" hidden></p>

      <svg
        id="scene"
        class="scene"
        xmlns="http://www.w3.org/2000/svg"
        aria-label="Plocha s kolečkem a objektem"
      >
        <g id="world">
          <clipPath id="holes-clip" clipPathUnits="userSpaceOnUse"></clipPath>
          <g id="hook" class="hook"></g>

          <g id="shape-group">
            <clipPath id="shape-clip" clipPathUnits="userSpaceOnUse">
              <path id="shape-clip-path"></path>
            </clipPath>
            <path id="shape-body" class="shape-body" />
            <path id="shape-stroke" class="shape-stroke" />
            <g id="drawings" clip-path="url(#shape-clip)"></g>
            <g id="holes"></g>
          </g>

          <g id="hook-over" class="hook" clip-path="url(#holes-clip)"></g>

          <g id="guess-layer" hidden></g>
        </g>
      </svg>
    </div>

    <script src="main.js"></script>
  </body>
</html>
